name: CI

# ─────────────────────────────────────────────────────────────
# 分支模型（完整流程见 docs/RELEASE-PROCESS.md）
#
#   dev/optimize  开发分支 —— 唯一开发入口，push 即跑完整流水线
#   master        上线分支 —— 内容 = dev/optimize − 开发资产（docs/、测试…）
#                           只能经 PR + Code Review + 本流水线全绿后合入
#
# 注意：测试一律跑在 dev/optimize 的代码上。原因是 master 由
# `scripts/sync-master.sh` 生成、**本身不含测试目录**，直接 pytest 会因
# 「没收集到用例」而失败；而 master 又是 dev/optimize 的子集，
# 所以验证 dev/optimize 等价于验证上线代码。
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [dev/optimize]
  pull_request:
    branches: [master]
  # 手动补跑：工作流曾被禁用时，push 事件不会被补发，只能靠这里重跑
  workflow_dispatch:

# 同一分支连续推送时取消旧运行，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁 1：后端测试 ───────────────────────────────────────
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 到 master 时也只测 dev/optimize：见文件头注释
          ref: ${{ github.event_name == 'pull_request' && 'dev/optimize' || github.ref }}

      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 的 python:3.11-slim 保持一致：CI 测的就是线上跑的
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        # requirements.txt 只有运行时依赖，pytest 在 requirements-dev.txt 里。
        # 早年 CI 只装前者，于是 `python -m pytest` 直接报 No module named pytest。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest test/ -q --tb=short

  # ── 门禁 2：前端 lint / 类型 / 单测 / 构建 ─────────────────
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'dev/optimize' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # 与 frontend/Dockerfile 的 node:20-alpine 保持一致
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── 门禁 3：上线分支内容校验（仅 PR 到 master）─────────────
  release-sync:
    name: Release sync check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/optimize

      - name: Fetch release branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: 校验 PR 内容恰好等于「dev/optimize − 排除清单」
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/sync-master.sh --verify "origin/$RELEASE_HEAD"

  # ── 非门禁：依赖安全扫描（结果仅供参考，不阻塞合入）────────
  dependency-scan:
    name: Dependency scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          # ⚠️ 必须走 console script。pip-audit 的**分发名**带连字符，模块名却是
          # `pip_audit`，所以 `python -m pip-audit` 会被解释成「找不到名为
          # pip-audit 的模块」，报 `No module named pip-audit` —— 长期被误读成
          # 扫描出的漏洞告警，实际只是调用名写错（装是装上了的）。
          pip-audit -r requirements.txt
