# Orbit — 一键启动全栈服务
#
#   cp .env.example .env   # 填入 LLM_API_KEY / SECRET_KEY
#   docker compose up -d --build
#
# 前端 http://localhost:3000 ｜ 后端 http://localhost:8001/docs

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 国内构建加速（可选）：在 .env 中设置 USE_CN_MIRRORS 相关项后生效，
        # 留空则走官方源，行为与原先一致。
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: orbit-backend:latest
    container_name: orbit-backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      # 向量库 / 上传件 / 用量日志 全部落在此卷，与 DATA_DIR 一致
      - orbit_data:/app/data
      # 知识库源文件目录（Knowledge Agent 只允许在此范围内规划）
      - ./knowledge:/app/knowledge:ro
    environment:
      ENV: production
      # 数据根目录必须与上方 volume 挂载点一致
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/multitenant.db
      # embedding 模型下载源：国内直连 huggingface.co 不可达，默认走镜像站；
      # 海外环境可覆盖为 https://huggingface.co
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # 以下从 .env 注入，缺失时服务会拒绝启动（配置校验）
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY 未设置，请先配置 .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 未设置，请先配置 .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # Fallback 必须能指向**另一个**端点，否则跨厂商降级会把请求发回主模型
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      KNOWLEDGE_ROOT: /app/knowledge
      # Agent Loop 允许落盘的根目录白名单（生产环境必须配置，否则拒绝绝对路径）
      AGENT_ALLOWED_ROOTS: ${AGENT_ALLOWED_ROOTS:-/app/knowledge}
      # 令牌时效：access 短、refresh 长（登录接口会同时下发两者）
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # 多副本部署时只在其中一个副本置 1，其余置 0（另有 DB 原子抢占兜底）
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
      # 部署在反向代理后必须置 1，否则限流按代理 IP 分桶会误伤所有用户
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-15000}
      ENABLE_PROMETHEUS: ${ENABLE_PROMETHEUS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    restart: unless-stopped
    healthcheck:
      # 用 /ready 而非 /health：只有依赖真正就绪才允许依赖方（前端）启动
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          r=urllib.request.urlopen('http://localhost:8001/ready',timeout=5);
          sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # Embedding 模型首次加载较慢，给足预热时间
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期注入：Next.js 的 NEXT_PUBLIC_* 在打包时内联
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        # 国内构建加速（可选）：留空则走官方源
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: orbit-frontend:latest
    container_name: orbit-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orbit_data:
    driver: local
