# gate.yaml — 机器可读，机械执行
# Agent loop 每次运行前必须读取并遵守
# 用户可直接编辑，下次 loop 开始前自动生效

denylist:
  # 密钥 & 凭证
  - .env
  - .env.*
  - .env.local
  - .env.production

  # 认证相关路径
  - "**/secrets/**"
  - "**/credentials/**"
  - "**/certs/**"
  - "**/*.pem"
  - "**/*-key.json"
  - "**/serviceAccount.json"

  # 支付 & 计费
  - "**/payments/**"
  - "**/billing/**"

  # 基础设施配置
  - "**/terraform/**"
  - "**/*.tfstate"
  - "**/infrastructure/**"

  # CI/CD 配置
  - ".github/workflows/*-deploy*"
  - "**/deploy.yml"

  # 数据库迁移（高风险）
  - "**/migrations/**"

# 执行模式: reject（拒绝）| warn（警告但继续）| log_only（仅记录）
enforcement: reject

# 当命中 denylist 时
on_hit:
  action: abort_immediately
  notify: true

# 允许的测试命令前缀（Builder verification_commands 必须匹配）
allowed_commands:
  - "python -m pytest"
  - "python3 -m pytest"
  - "npm test"
  - "npm run test"
  - "npm run lint"
  - "go test"
  - "cargo test"
  - "make test"
  - "pytest"
  - "eslint"
  - "mypy"
  - "ruff check"
  - "black --check"
  - "prettier --check"
  - "python -h"
  - "python3 -h"
  - "python -c"
  - "python3 -c"
  - "node -e"
  - "node --version"
  - "npm --version"
  - "echo"
  - "cat"
  - "ls"
  - "grep"
  - "find"
  - "wc"
  - "head"
  - "tail"
  - "diff"
  - "git status"
  - "git diff"
  - "git log"
  - "date"
  - "pwd"

# 自动合并允许列表（L3 无人值守模式）
auto_merge_allowlist:
  only_if:
    - change_type_is: ["typo", "lint_fix", "import_sort", "comment_fix", "doc_update"]
    - not_in_denylist: true
    - all_tests_pass: true

# ── 测试分层（P3）：test_level 决定 Builder 验证命令的最低深度要求 ──
# require_verification: 是否必须提供至少 1 条验证命令
# require_test: 是否必须提供至少 1 条测试命令（pytest/go test/npm test 等）
# allowed_prefixes: 该档位允许的验证命令前缀（超出视为 warning，不阻止执行）
# 说明: 分层是"充分性要求"，不替代 allowed_commands 白名单（安全拦截）。
test_levels:
  skip:
    require_verification: false
    require_test: false
    allowed_prefixes: []            # ≤10 行/纯转换/常量文案，免测
  smoke:
    require_verification: true      # 至少 1 条验证命令
    require_test: false
    allowed_prefixes:
      - "python3 -m pytest"
      - "python -m pytest"
      - "pytest"
      - "npm run lint"
      - "npm run test"
      - "eslint"
      - "mypy"
      - "ruff check"
      - "black --check"
      - "prettier --check"
      - "node -e"
  full:
    require_verification: true
    require_test: true              # 核心路径/状态变更/多分支：强制测试
    allowed_prefixes:
      - "python3 -m pytest"
      - "python -m pytest"
      - "pytest"
      - "npm test"
      - "npm run test"
      - "go test"
      - "cargo test"
      - "make test"
